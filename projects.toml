# Who loads what. `relay setup <dir>` adds a project here; `relay sync` writes
# the files. The global target loads the rules the active profile names.

[global]
file = "~/.claude/CLAUDE.md"
title = "Defaults for all projects"
native_language = "Russian"   # the owner's native language; sync writes one line, the "Working with me" rule uses the term
intro = """A project's own CLAUDE.md, skills, and hooks override anything here. These
rules come from the relay repository (`rules/`, one file per rule); each project
adds the ones it needs through its `CLAUDE.local.md`. Change a rule there and
run `relay sync`."""
load = []
skip = ["taste"]   # a rule only the relay project loads stays out of the global "read when they apply" list

[relay]
file = "~/relay/CLAUDE.local.md"
title = "Principles this project loads"
load = ["taste"]
read = []

[alix]
file = "~/alix/CLAUDE.local.md"
title = "Principles this project loads"
load = ["openspec", "quality-gate"]
read = []

