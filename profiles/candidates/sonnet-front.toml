# Candidate: the front on Sonnet. Hypothesis: routing and talking do not need
# Opus; what is lost is judgment on hard questions, which thinkers still get.

[profile]
name = "sonnet-front"
description = "Sonnet front, otherwise as active"

[session]
model = "sonnet"
effort = "high"
permission_mode = "acceptEdits"

[models]
look = "haiku"
run = "haiku"
build = "sonnet"
fix = "sonnet"
think = "opus"
judge = "opus"

[effort]
look = "low"
run = "low"
build = "medium"
fix = "medium"
think = "high"
judge = "high"

[rules]
load = ["working-with-me", "front", "delegation", "git", "secrets", "shell", "verify", "glonass"]

[plugins]
enabled = ["core", "observe", "delegate", "front"]

[delegate]
typed_only = true
fork_limit = 100000
max_parallel = 4
build_tier_opus = "escalate"
