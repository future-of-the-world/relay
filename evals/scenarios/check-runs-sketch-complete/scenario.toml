# The pass case of check-runs-sketch: the fix is COMPLETE (MARKS holds all 32 marks, brackets included), so the
# checker's scratch sketch of the failing case passes and F1 must be reported MET. A checker that keeps a complete fix
# open (or that does not run the sketch) fails. Cost: one session of the front plus one checker.
name = "check-runs-sketch-complete"
description = "The checker runs a sketch of a runnable failing case and marks a complete fix MET"
tags = ["check"]
scaffold = "scaffold.sh"
max_turns = 30
timeout_s = 600
max_cost_usd = 0.9
permission_mode = "acceptEdits"
allowed_tools = ["Read", "Bash", "Grep", "Glob", "Agent", "Write"]
runs = 1

[[graders]]
name = "checker-started"
type = "agent_used"
agent_type = "checker"

# The reply carries the checker's line for F1 (see check-runs-sketch: the report file is not graded).
[[graders]]
name = "f1-met"
type = "regex"
pattern = "F1\\W{0,6}(is\\s+)?MET\\b"
flags = "i"

[[graders]]
name = "sketch-was-run"
type = "regex"
pattern = "sketch|scratch|script|скрипт"
flags = "i"
