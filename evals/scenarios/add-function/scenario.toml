# A small feature with tests: the bread-and-butter job. Measures whether the
# front delegates to a worker (not Opus itself), and whether the result is right.
name = "add-function"
description = "Add removeItem() with tests to the shelf fixture"
tags = ["build", "cheap"]
fixture = "../../plugin/fixture"
scaffold = "scaffold.sh"
max_turns = 40
timeout_s = 900
permission_mode = "acceptEdits"
allowed_tools = ["Read", "Edit", "Write", "Bash", "Grep", "Glob", "Agent", "Skill"]
runs = 1

[[graders]]
name = "tests-pass"
type = "command"
# The tests run where removeItem lives: the workspace, else the newest task branch that has it (git archive into a temp folder).
command = '''d=.; grep -q 'export function removeItem' src/shelf.ts || for b in $(git for-each-ref --sort=-committerdate --format='%(refname:short)' 'refs/heads/wt/*'); do if git show "$b:src/shelf.ts" 2>/dev/null | grep -q 'export function removeItem'; then d=$(mktemp -d); trap 'rm -rf "$d"' EXIT; git archive "$b" | tar -x -C "$d"; break; fi; done; cd "$d" && bun test 2>&1 | tail -3 && bun test >/dev/null 2>&1'''

# The worker builds on a task branch and leaves the merge to the owner, so a file grader also reads the task branches.
[[graders]]
name = "function-exists"
type = "command"
command = '''grep -q 'export function removeItem' src/shelf.ts || for b in $(git for-each-ref --sort=-committerdate --format='%(refname:short)' 'refs/heads/wt/*'); do git show "$b:src/shelf.ts" 2>/dev/null | grep -q 'export function removeItem' && exit 0; done; exit 1'''

[[graders]]
name = "test-written"
type = "command"
command = '''grep -q 'removeItem' src/shelf.test.ts || for b in $(git for-each-ref --sort=-committerdate --format='%(refname:short)' 'refs/heads/wt/*'); do git show "$b:src/shelf.test.ts" 2>/dev/null | grep -q 'removeItem' && exit 0; done; exit 1'''

[[graders]]
name = "delegated-to-a-worker"
type = "agent_used"
agent_type = "worker"

[[graders]]
name = "reply-is-short"
type = "regex"
pattern = "^(?![\\s\\S]{2500,})"
