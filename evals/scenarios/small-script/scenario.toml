# The "Opus wrote a simple script" case: a throwaway script. The right setup
# sends it to a worker on the middle model and answers in two lines.
name = "small-script"
description = "A bin/ script that prints the item count"
tags = ["build", "cheap"]
fixture = "../../plugin/fixture"
scaffold = "scaffold.sh"
max_turns = 25
timeout_s = 600
permission_mode = "acceptEdits"
allowed_tools = ["Read", "Edit", "Write", "Bash", "Grep", "Glob", "Agent", "Skill"]
runs = 1

[[graders]]
name = "script-runs"
type = "command"
# A task branch is read too: the worker leaves the merge to the owner.
command = "t() { test -x \"$1/bin/count\" && \"$1/bin/count\" src/shelf.test.ts | grep -Eq '^[0-9]+$'; }; t . && exit 0; for b in $(git for-each-ref --sort=-committerdate --format='%(refname:short)' 'refs/heads/wt/*'); do d=$(mktemp -d); git archive \"$b\" bin/count 2>/dev/null | tar -x -C \"$d\" 2>/dev/null && t \"$d\" && exit 0; done; exit 1"

[[graders]]
name = "delegated-to-a-worker"
type = "agent_used"
agent_type = "worker"

[[graders]]
name = "no-opus-agent"
type = "agent_used"
agent_type = "thinker|critic"
exists = false
