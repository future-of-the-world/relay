# Bindings of the eval fixture: shaped like Kartoteka, much smaller.
[project]
name = "shelf"
default_branch = "master"
worktrees = ".worktrees"
stack_skills = []

[front]
# No eval case is about lanes: the end-of-turn lanes reminder stays off so the graders read the real answer, not a second short reply.
stop_nudge = 0

[gate]
wt = "bin/wt"
check = "bin/check"
ci = "bin/ci"
ci_log = ".ci/ci.log"

[[spec_check.group]]
name = "stored data"
trigger = '\b(stor(?:e|ed|es|ing|age)|sav(?:e|es|ed|ing)|persist\w*|restor(?:e|es|ed|ing)|file)\b'
[spec_check.group.cases]
"Corrupt data" = 'unreadable|corrupt\w*|garbage|(not valid|invalid) JSON|malformed'
"Older data" = 'older version|old(er)? data|saved before|missing field|unknown version'
"Storage unavailable" = 'storage (is |was )?(unavailable|blocked|full)|cannot (be )?(read|writ(e|ten))|missing file|does not exist'
