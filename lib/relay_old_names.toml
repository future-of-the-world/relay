# The old forms relay setup and relay doctor look for when they move a project off the plugin once named `sdd`
# (it is OpenSpec, and is named so). This is the one place the old names live; tests/test_spec_steps.py checks the shape.

[plugin_key]            # enabledPlugins / installed_plugins.json keys: old -> new
"sdd@relay" = "openspec@amidman"
"sdd@principles" = "openspec@amidman"

[kit_flow]              # .claude/kit.toml [flow] forms from before spec steps were their own setting
old_kind = "openspec"   # [flow] kind = "openspec" becomes [flow] kind = "none" and [specs] method = <specs_method>
old_plugin = "sdd"      # [flow] plugin = "sdd" is removed
specs_method = "openspec"

[stored_rule]           # a projects.toml load entry that is now derived from kit.toml [specs]
names = ["openspec"]

[[addition]]            # .claude/kit/<file> written for a stage that no longer exists: the rules move to <new>
old = "parallel-apply.md"
new = "worker.md"

[[addition]]
old = "apply-review.md"
new = "critic.md"

[agent_prefix]          # agent and skill names that name the old plugin in project files
old = "sdd:"
