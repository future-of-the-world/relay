# Prices relay uses to turn tokens into money. USD per million tokens.
#
# These are ESTIMATES for the ledger and `relay report`; the benchmark reads the
# cost Claude Code itself reports (`total_cost_usd` / `modelUsage`), which is
# authoritative. Re-measure when the platform changes its prices or cache
# behaviour, and keep the date.
#
# Default rows reflect the ratios measured by the owner in 2026-10 (see
# rules/delegation.md): cache read is the same on every model; on Opus a cache
# write costs 25 reads and an output 100; on Sonnet 12.5 and 50; Haiku is
# set at a quarter of Sonnet.
#
# A model id is matched by the first key that is a substring of it (longest
# key first), so "claude-opus-5-20261001" matches "opus".

measured = "2026-10-19"

[models.opus]
input = 5.00
cache_write = 5.00
cache_read = 0.20
output = 20.00

[models.sonnet]
input = 2.50
cache_write = 2.50
cache_read = 0.20
output = 10.00

[models.haiku]
input = 0.60
cache_write = 0.60
cache_read = 0.20
output = 2.50

[models.default]
input = 2.50
cache_write = 2.50
cache_read = 0.20
output = 10.00
